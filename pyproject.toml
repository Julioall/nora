[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nora-cli"
version = "0.1.0"
description = "Assistente CLI com Needle 3 para Wikipédia, clima e anotações"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["cactus-compute>=4,<5", "opencv-python>=4.10,<5"]

[project.scripts]
nora = "nora.cli:main"

[tool.setuptools.packages.find]
include = ["nora*"]
